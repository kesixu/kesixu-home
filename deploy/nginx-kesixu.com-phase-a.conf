# kesixu.com — 阶段 A：仅 80 端口（证书签发前的临时形态）
# certbot webroot 验证走 acme-challenge，其余请求先 301 到 https（短暂窗口内 https 未就绪属预期）
server {
    listen 80;
    listen [::]:80;
    server_name kesixu.com www.kesixu.com;
    root /var/www/kesixu-home;

    location /.well-known/acme-challenge/ {
        root /var/www/kesixu-home;
    }

    location / {
        return 301 https://kesixu.com$request_uri;
    }
}
