# 从线上同步 · 2026-08-13(新增 media-src 'self' 供 /pathbot/ 视频)
# kesixu.com — 《划亮》公开个人主页（纯静态）
# 模板源自 conference.kesixu.com 加固版，差异：无 basic auth、允许收录、
# 放行搜索与 AI 爬虫（曝光渠道），仅拦攻击工具与高噪声扫描器。
# 注意：不设 default_server（443 catch-all 已由 chaogu 配置持有）。

limit_req_zone $binary_remote_addr zone=kesixu_home:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=kesixu_home_conn:10m;

map $http_user_agent $bad_ua_kesixu_home {
    default 0;
    ~*(masscan|nmap|sqlmap|nikto|gobuster|dirbuster|wpscan|zgrab|Censys|InternetMeasurement|stretchoid) 1;
    ~*(SemrushBot|AhrefsBot|MJ12bot|DotBot) 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name kesixu.com www.kesixu.com;
    root /var/www/kesixu-home;

    location /.well-known/acme-challenge/ {
        root /var/www/kesixu-home;
    }

    location / {
        return 301 https://kesixu.com$request_uri;
    }
}

# www → apex 归一
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kesixu.com;

    ssl_certificate /etc/letsencrypt/live/kesixu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kesixu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://kesixu.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kesixu.com;
    root /var/www/kesixu-home;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/kesixu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kesixu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($bad_ua_kesixu_home) { return 444; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    client_max_body_size 1M;

    # 探测路径直接 404（静态站常见扫描噪声）
    location ~* /(wp-admin|wp-login|xmlrpc|\.env|\.git|phpmyadmin|adminer|\.aws|\.ssh|cgi-bin) {
        return 404;
    }
    location ~ /\. { deny all; }

    # 长缓存资产（内容变更靠文件名/?v= 版本号）
    location ~* ^/(fonts|vendor|assets)/ {
        limit_req zone=kesixu_home burst=60 nodelay;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # HTML 用 ?v= 更新这两个入口；版本化资源可安全长期缓存，回访不重复下载。
    location ~* ^/(main\.js|style\.css)$ {
        limit_req zone=kesixu_home burst=60 nodelay;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        limit_req zone=kesixu_home burst=60 nodelay;
        limit_conn kesixu_home_conn 20;

        expires -1;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

        try_files $uri $uri/ =404;
    }
}
