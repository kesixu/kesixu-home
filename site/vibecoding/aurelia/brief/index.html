<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>研究简报 · 凭邀请码阅读 · Aurelia</title>
<style>
:root{--bg:#121619;--moon:#d9dfdc;--sky:#9dbbb0;--ash:#8f968f;--ver:#b24a3c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(900px 500px at 80% 0%,rgba(157,187,176,.14),transparent 60%),var(--bg);color:var(--moon);font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;padding:24px}
.card{width:min(440px,100%);padding:36px 32px 30px;border:1px solid rgba(217,223,220,.14);border-radius:14px;background:rgba(255,255,255,.025)}
.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--sky);margin:0 0 14px}
h1{font-family:"Songti SC","Noto Serif CJK SC","SimSun",serif;font-weight:500;font-size:26px;line-height:1.35;margin:0 0 10px}
p{margin:0 0 18px;font-size:14.5px;line-height:1.8;color:#b9c3bd}
form{display:flex;gap:10px;margin-top:6px}
input{flex:1;min-width:0;padding:12px 14px;border-radius:8px;border:1px solid rgba(217,223,220,.25);background:rgba(0,0,0,.25);color:var(--moon);font-size:16px;letter-spacing:.06em;outline:none}
input:focus{border-color:var(--sky)}
button{padding:12px 18px;border-radius:8px;border:1px solid rgba(217,223,220,.35);background:transparent;color:var(--moon);font-size:14.5px;cursor:pointer;white-space:nowrap}
button:hover,button:focus{border-color:var(--sky);background:rgba(157,187,176,.1)}
button[disabled]{opacity:.5;cursor:default}
.msg{min-height:22px;margin-top:12px;font-size:13px;color:var(--ash)}
.msg.err{color:#e0907f}
.foot{margin-top:22px;font-size:12px;color:var(--ash)}
.foot a{color:var(--sky);text-decoration:none;border-bottom:1px solid rgba(157,187,176,.4)}
</style>
</head>
<body>
<main class="card">
<p class="eyebrow">AURELIA · 研究简报</p>
<h1>AI 读懂的是“意图”，还是“制作”？</h1>
<p>这份简报记录了实验的方法、数据与结果，仅供受邀者阅读。请输入邀请码。</p>
<form id="gate" autocomplete="off">
<input id="code" type="password" inputmode="latin" placeholder="邀请码" aria-label="邀请码" required>
<button id="go" type="submit">阅读</button>
</form>
<div class="msg" id="msg" aria-live="polite"></div>
<p class="foot"><a href="/vibecoding/aurelia/">返回介绍页</a></p>
</main>
<script src="brief.js" defer></script>
</body>
</html>
