<!-- @dsCard group="Foundations" name="火焰色板" subtitle="唯一色系：从炭到金，禁止新增色相" -->
<!doctype html><meta charset='utf-8'><style>
:root { --ink:#0d0b09; --ember:#b33a1e; --flame:#ff6b35; --amber:#ffa94d; --gold:#ffd28a;
        --paper:#f2ece1; --smoke:#8a8378; --char:#2a2019; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--ink); color:var(--paper); min-height:100vh;
       font-family:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
.stage { padding:40px 34px; }
.label { font-size:10px; letter-spacing:.24em; color:var(--smoke); text-transform:uppercase; margin-bottom:18px; }
.display { font-family:"LXGW WenKai",serif; }
.echo { font-family:"EB Garamond",Georgia,serif; font-style:italic; color:#6f695f; }
</style>
<body>
<div class="stage">
  <div class="label">Palette · 火焰光谱</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px">
    
    <div style="border:1px solid #241d16;border-radius:10px;overflow:hidden">
      <div style="height:74px;background:#0d0b09"></div>
      <div style="padding:10px 12px;font-size:12px;color:var(--smoke)">ink 暖炭黑（底）<br>
        <span style="color:var(--paper);font-family:monospace">#0d0b09</span></div>
    </div>
    <div style="border:1px solid #241d16;border-radius:10px;overflow:hidden">
      <div style="height:74px;background:#2a2019"></div>
      <div style="padding:10px 12px;font-size:12px;color:var(--smoke)">char 未燃物<br>
        <span style="color:var(--paper);font-family:monospace">#2a2019</span></div>
    </div>
    <div style="border:1px solid #241d16;border-radius:10px;overflow:hidden">
      <div style="height:74px;background:#b33a1e"></div>
      <div style="padding:10px 12px;font-size:12px;color:var(--smoke)">ember 余烬红<br>
        <span style="color:var(--paper);font-family:monospace">#b33a1e</span></div>
    </div>
    <div style="border:1px solid #241d16;border-radius:10px;overflow:hidden">
      <div style="height:74px;background:#ff6b35"></div>
      <div style="padding:10px 12px;font-size:12px;color:var(--smoke)">flame 火橙<br>
        <span style="color:var(--paper);font-family:monospace">#ff6b35</span></div>
    </div>
    <div style="border:1px solid #241d16;border-radius:10px;overflow:hidden">
      <div style="height:74px;background:#ffa94d"></div>
      <div style="padding:10px 12px;font-size:12px;color:var(--smoke)">amber 琥珀<br>
        <span style="color:var(--paper);font-family:monospace">#ffa94d</span></div>
    </div>
    <div style="border:1px solid #241d16;border-radius:10px;overflow:hidden">
      <div style="height:74px;background:#ffd28a"></div>
      <div style="padding:10px 12px;font-size:12px;color:var(--smoke)">gold 烛金<br>
        <span style="color:var(--paper);font-family:monospace">#ffd28a</span></div>
    </div>
    <div style="border:1px solid #241d16;border-radius:10px;overflow:hidden">
      <div style="height:74px;background:#f2ece1"></div>
      <div style="padding:10px 12px;font-size:12px;color:var(--smoke)">paper 烛光纸白<br>
        <span style="color:var(--paper);font-family:monospace">#f2ece1</span></div>
    </div>
    <div style="border:1px solid #241d16;border-radius:10px;overflow:hidden">
      <div style="height:74px;background:#8a8378"></div>
      <div style="padding:10px 12px;font-size:12px;color:var(--smoke)">smoke 烟灰<br>
        <span style="color:var(--paper);font-family:monospace">#8a8378</span></div>
    </div>
  </div>
  <p style="margin-top:20px;font-size:12.5px;color:var(--smoke);line-height:2">
    规则：一切可见之物都像"被火光照亮"，而不是自己发光。文字只用 paper/smoke，强调只用火焰系。</p>
</div></body>
