<!-- @dsCard group="Foundations" name="火焰色板" subtitle="唯一色系：从炭到金" -->
<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<body><div class="ds-stage">
  <div class="ds-label">Palette · 火焰光谱</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px">
    <div style="border:1px solid #241d16;border-radius:10px;overflow:hidden">
      <div style="height:74px;background:var(--color-ink)"></div>
      <div style="padding:10px 12px;font-size:12px;color:var(--color-smoke)">暖炭黑 · 地（禁纯黑）<br>
        <span style="color:var(--color-paper);font-family:monospace">--color-ink</span></div>
    </div>
    <div style="border:1px solid #241d16;border-radius:10px;overflow:hidden">
      <div style="height:74px;background:var(--color-char)"></div>
      <div style="padding:10px 12px;font-size:12px;color:var(--color-smoke)">未燃物<br>
        <span style="color:var(--color-paper);font-family:monospace">--color-char</span></div>
    </div>
    <div style="border:1px solid #241d16;border-radius:10px;overflow:hidden">
      <div style="height:74px;background:var(--color-ember)"></div>
      <div style="padding:10px 12px;font-size:12px;color:var(--color-smoke)">余烬红<br>
        <span style="color:var(--color-paper);font-family:monospace">--color-ember</span></div>
    </div>
    <div style="border:1px solid #241d16;border-radius:10px;overflow:hidden">
      <div style="height:74px;background:var(--color-flame)"></div>
      <div style="padding:10px 12px;font-size:12px;color:var(--color-smoke)">火橙<br>
        <span style="color:var(--color-paper);font-family:monospace">--color-flame</span></div>
    </div>
    <div style="border:1px solid #241d16;border-radius:10px;overflow:hidden">
      <div style="height:74px;background:var(--color-amber)"></div>
      <div style="padding:10px 12px;font-size:12px;color:var(--color-smoke)">琥珀 · 点亮态<br>
        <span style="color:var(--color-paper);font-family:monospace">--color-amber</span></div>
    </div>
    <div style="border:1px solid #241d16;border-radius:10px;overflow:hidden">
      <div style="height:74px;background:var(--color-gold)"></div>
      <div style="padding:10px 12px;font-size:12px;color:var(--color-smoke)">烛金 · 最高亮<br>
        <span style="color:var(--color-paper);font-family:monospace">--color-gold</span></div>
    </div>
    <div style="border:1px solid #241d16;border-radius:10px;overflow:hidden">
      <div style="height:74px;background:var(--color-paper)"></div>
      <div style="padding:10px 12px;font-size:12px;color:var(--color-smoke)">烛光纸白 · 正文<br>
        <span style="color:var(--color-paper);font-family:monospace">--color-paper</span></div>
    </div>
    <div style="border:1px solid #241d16;border-radius:10px;overflow:hidden">
      <div style="height:74px;background:var(--color-smoke)"></div>
      <div style="padding:10px 12px;font-size:12px;color:var(--color-smoke)">烟灰 · 次级<br>
        <span style="color:var(--color-paper);font-family:monospace">--color-smoke</span></div>
    </div>
  </div>
  <p class="ds-note" style="margin-top:22px">规则：一切可见之物都"被火光照亮"而非自己发光。文字只用 paper/smoke；
  同一小组件内不混用两档火色；对比度下限：正文级文字 ≥4.5:1（smoke on ink = 5.24 ✓）。</p>
</div></body>
